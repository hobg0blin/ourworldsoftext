# /etc/nginx/sites-available/owot.bront.rodeo
#   sudo ln -s /etc/nginx/sites-available/owot.bront.rodeo /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d owot.bront.rodeo   # adds the 443 block + redirect
server {
    listen 80;
    listen [::]:80;
    server_name owot.bront.rodeo;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
